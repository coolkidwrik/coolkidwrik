name: Update stats cards

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-stats.mjs"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

# Only one run at a time; extra runs wait instead of racing each other.
concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate SVGs
        run: node scripts/generate-stats.mjs "${{ github.repository_owner }}"
        env:
          # Uses a personal token if you add STATS_TOKEN (enables private-contribution counts);
          # otherwise falls back to the built-in token, which works for public data.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update stats cards"
          # Pull in anything pushed since checkout, then push (retry a few times).
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "Push failed (attempt $i), retrying..."
            sleep 5
          done
          exit 1
